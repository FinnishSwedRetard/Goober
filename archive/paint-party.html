<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paint Party</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: #111827;
      color: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: radial-gradient(ellipse at top, #1e293b 0%, #111827 58%);
      color: #f8fafc;
    }
    .page {
      width: min(100%, 860px);
      display: grid;
      gap: 18px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .arcade-link {
      display: inline-block;
      color: #93c5fd;
      text-decoration: none;
      font-weight: 800;
    }
    .arcade-link:hover { text-decoration: underline; }
    .game-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      gap: 18px;
      align-items: start;
      padding: 18px;
      border-radius: 18px;
      border: 1px solid #334155;
      background: rgba(15, 23, 42, 0.86);
      box-shadow: 0 18px 44px rgba(0,0,0,0.25);
    }
    .canvas-wrap {
      display: grid;
      gap: 12px;
    }
    .game-info {
      margin: 0;
      color: #cbd5e1;
      font-size: 0.95rem;
      line-height: 1.6;
      text-align: left;
    }
    canvas {
      display: block;
      width: min(100%, 500px);
      height: auto;
      aspect-ratio: 1;
      margin: 0 auto;
      background: #f8fafc;
      border: 2px solid #475569;
      border-radius: 12px;
      cursor: crosshair;
      image-rendering: pixelated;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.2);
    }
    .tools {
      display: grid;
      gap: 12px;
      align-content: start;
    }
    .color-box {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: center;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid #475569;
    }
    input[type="color"] {
      width: 52px;
      height: 52px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .label {
      font-size: 0.9rem;
      color: #cbd5e1;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .status {
      min-height: 26px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid #475569;
      color: #dbeafe;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .panel {
      padding: 14px 12px;
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid #475569;
      color: #cbd5e1;
      font-size: 0.9rem;
      line-height: 1.6;
      text-align: left;
    }
    .panel strong { color: #fff; }
    @media (max-width: 700px) {
      .game-shell {
        grid-template-columns: 1fr;
      }
      canvas {
        width: min(100%, 420px);
      }
      .topbar {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <a class="arcade-link" href="../index.html">← Back to the arcade</a>
    </div>

    <div class="game-shell">
      <div class="canvas-wrap">
        <p class="game-info">
          <strong>Paint Party</strong> is a local canvas. Pick a color and click the board to paint one square at a time.
        </p>
        <canvas id="board" width="500" height="500" aria-label="Local paint board"></canvas>
      </div>

      <div class="tools">
        <div class="color-box">
          <span class="label">Color</span>
          <input id="color" type="color" value="#ff0000" aria-label="Choose paint color" />
        </div>

        <div id="status" class="status" aria-live="polite">Local board ready</div>

        <div class="panel">
          <strong>How to play:</strong><br>
          Click a square on the board to paint it.<br>
          Your drawing stays on this page.<br>
          Pick a new color to keep drawing.
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const colorInput = document.getElementById("color");
    const statusEl = document.getElementById("status");

    const CELL = 25;
    const GRID = 500 / CELL;
    function drawBoardBase() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < GRID; y++) {
        for (let x = 0; x < GRID; x++) {
          ctx.fillStyle = "#f8fafc";
          ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
          ctx.strokeStyle = "#e2e8f0";
          ctx.strokeRect(x * CELL, y * CELL, CELL, CELL);
        }
      }
    }

    function drawCell(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    }

    function getCellFromEvent(event) {
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor(((event.clientX - rect.left) / rect.width) * GRID);
      const y = Math.floor(((event.clientY - rect.top) / rect.height) * GRID);

      if (x < 0 || x >= GRID || y < 0 || y >= GRID) return null;
      return { x, y };
    }

    function paintCell(x, y) {
      drawCell(x, y, colorInput.value);
      statusEl.textContent = "Painted locally";
    }

    canvas.addEventListener("click", (event) => {
      const cell = getCellFromEvent(event);
      if (!cell) return;
      paintCell(cell.x, cell.y);
    });

    drawBoardBase();
  </script>
</body>
</html>
